name: Publish React Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to publish as dev release (leave empty for HEAD)"
        required: false
        type: string
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    # Dev releases (workflow_dispatch) are only allowed from main
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on:
      group: arc-public-large-amd64-runner
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.config.outputs.npm_tag }}
      ref: ${{ steps.version.outputs.source_sha }}
      should_publish: ${{ steps.config.outputs.should_publish }}

    steps:
      - name: Determine release type
        id: config
        # Use env vars to avoid script injection via github context interpolation
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_SHA: ${{ github.sha }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "npm_tag=dev" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "ref=${INPUT_COMMIT_SHA:-$GITHUB_SHA}" >> $GITHUB_OUTPUT
          elif [ "$PR_MERGED" = "true" ] && \
               echo "$PR_LABELS" | grep -q '"release"' && \
               echo "$PR_BODY" | grep -q "<!-- release_target:react -->"; then
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "ref=$GITHUB_SHA" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: steps.config.outputs.should_publish == 'true'
        with:
          ref: ${{ steps.config.outputs.ref }}
          fetch-depth: 0

      - name: Validate commit exists on main
        if: steps.config.outputs.should_publish == 'true' && github.event_name == 'workflow_dispatch'
        env:
          TARGET_REF: ${{ steps.config.outputs.ref }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$TARGET_REF" origin/main; then
            echo "::error::Commit $TARGET_REF is not on the main branch. Dev releases can only be published from merged code."
            exit 1
          fi

      - name: Setup Node.js for release planning
        if: steps.config.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test release preparation and verification
        if: steps.config.outputs.should_publish == 'true'
        run: node --test scripts/js-release.test.mjs

      - name: Plan candidate versions and validate registry prerequisites
        if: steps.config.outputs.should_publish == 'true'
        id: version
        env:
          RELEASE_TAG: ${{ steps.config.outputs.npm_tag }}
        run: node scripts/js-release.mjs plan --target react --tag "$RELEASE_TAG"

  package:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: idkit-react-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install the locked build dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare final manifests, build once and pack once
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.npm_tag }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/idkit-release
        run: node scripts/js-release.mjs prepare --target react --tag "$RELEASE_TAG" --directory "$RELEASE_DIRECTORY"

      - name: Retain the exact candidate artifacts for qualification and publication
        uses: actions/upload-artifact@v4
        with:
          name: idkit-react-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/idkit-release/
          if-no-files-found: error
          retention-days: 14

  conformance:
    needs: [prepare, package]
    if: needs.prepare.outputs.should_publish == 'true'
    uses: ./.github/workflows/js-conformance.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      release_artifact: ${{ needs.package.outputs.artifact_name }}
      release_target: react
    permissions:
      contents: read

  publish:
    needs: [prepare, package, conformance]
    if: needs.prepare.outputs.should_publish == 'true'
    # Trusted publishing receives the exact tarball qualified by conformance.
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download the qualified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/idkit-release

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm for OIDC trusted publishing
        run: npm install -g npm@12.0.1

      - name: Verify source, final dependency pins and every tarball digest
        id: verify
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.npm_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.ref }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/idkit-release
        run: node scripts/js-release.mjs verify --target react --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --directory "$RELEASE_DIRECTORY"

      - name: Publish the qualified tarball
        env:
          TARBALL: ${{ steps.verify.outputs.tarball }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        run: npm publish "$TARBALL" --access public --provenance --tag "$NPM_TAG"
