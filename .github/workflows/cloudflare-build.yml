name: Cloudflare example build

on:
  pull_request:
    paths:
      - js/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/cloudflare-build.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-example-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    runs-on:
      group: arc-public-large-amd64-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C js/examples/nextjs install --frozen-lockfile
      - run: pnpm -C js/examples/nextjs build:cloudflare
