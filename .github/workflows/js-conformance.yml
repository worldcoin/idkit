name: JavaScript and Rust compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    name: Native Rust differential tests
    runs-on:
      group: arc-public-large-amd64-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Read rust-toolchain
        id: rust-version
        run: echo "toolchain=$(yq '.toolchain.channel' rust-toolchain.toml)" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:conformance
      - run: cargo test --locked -p idkit-core --features conformance

  packages:
    name: Published package consumption (Node ${{ matrix.node }})
    runs-on:
      group: arc-public-large-amd64-runner
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup build Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Setup consumer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      # Node 18 runs the packed consumers, not the development test framework.
      - run: pnpm test:packages

      - name: Install isolated browser and Worker test dependencies
        if: matrix.node == '22'
        run: |
          pnpm -C tools/runtime install --frozen-lockfile
          pnpm -C tools/runtime exec playwright install --with-deps chromium

      - name: Test browser and Worker runtimes
        if: matrix.node == '22'
        run: pnpm test:portable

  hermes:
    name: Hermes engine compatibility (RN 0.79.2)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Read rust-toolchain
        id: rust-version
        run: echo "toolchain=$(yq '.toolchain.channel' rust-toolchain.toml)" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Extract the pinned React Native Hermes VM
        # Fetch only the published VM, without installing RN's dependency tree.
        run: |
          HERMES_DIRECTORY="$RUNNER_TEMP/idkit-hermes"
          mkdir -p "$HERMES_DIRECTORY"
          TARBALL=$(npm pack react-native@0.79.2 --ignore-scripts --json --registry=https://registry.npmjs.org --pack-destination "$HERMES_DIRECTORY" | jq -er '.[0].filename')
          tar -xzf "$HERMES_DIRECTORY/$TARBALL" -C "$HERMES_DIRECTORY" package/sdks/hermesc/osx-bin/hermes
          echo "HERMES_BIN=$HERMES_DIRECTORY/package/sdks/hermesc/osx-bin/hermes" >> "$GITHUB_ENV"

      - name: Test live Rust cases and built core/hooks in Hermes
        run: node scripts/test-hermes.mjs
